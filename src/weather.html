<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      rel="icon"
      href="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTY2pyIlFI93jzH4g9a-hNgOYw4TQpELscvDA&s"
    />
    <link rel="stylesheet" href="output.css" />
  </head>

  <body class="bg-linear-to-bl from-sky-300 to-sky-100 min-h-screen">
    <!-- NabBar -->
    <nav class="bg-white shadow-md">
      <div class="max-w-6xl mx-auto px-4">
        <div class="flex justify-between items-center h-16">
          <div class="text-xl font-bold text-blue-600">Smart Travel</div>
          <div class="hidden md:flex space-x-6">
            <a href="home.html" class="text-gray-700 hover:text-blue-600"
              >Home</a
            >
            <a href="destination.html" class="text-gray-700 hover:text-blue-600"
              >Destination</a
            >
            <a href="weather.html" class="text-gray-700 hover:text-blue-600"
              >Weather</a
            >
            <a href="places.html" class="text-gray-700 hover:text-blue-600"
              >Places</a
            >
            <a href="budget.html" class="text-gray-700 hover:text-blue-600"
              >Budget</a
            >
          </div>
        </div>
      </div>
    </nav>

    <!-- Weather Card -->

    <div class="flex justify-center mt-20 px-4">
      <div
        class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md text-center"
      >
        <h1 class="text-2xl font-bold text-sky-600 mb-1">Weather Card</h1>
        <h2 id="cityName" class="text-xl text-gray-600 font-semibold mb-6"></h2>

        <!-- Loading -->
        <div id="loading" class="text-gray-500 animate-pulse">
          Fetching Weather Data...
        </div>

        <!-- Weather Data -->
        <div
          id="weatherBox"
          class="mt-6 bg-sky-50 rounded-xl p-5 space-y-4 text-gray-700 hidden"
        >
          <div class="flex justify-between">
            <span class="font-semibold">🌡️ Temprature</span>
            <span><span id="temp"></span>°C </span>
          </div>

          <div class="flex justify-between">
            <span class="font-semibold">😊 Like feels</span>
            <span><span id="feels"></span>°C </span>
          </div>
          <div class="flex justify-between">
            <span class="font-semibold">🌨️ Condition</span>
            <span id="desc"></span>
          </div>
          <div class="flex justify-between">
            <span class="font-semibold">💧 Humidity</span>
            <span><span id="humidity"></span>% </span>
          </div>
          <div class="flex justify-between">
            <span class="font-semibold">💨 wind speed</span>
            <span><span id="wind"></span>m/s</span>
          </div>
        </div>

        <!-- Error -->
        <p id="error" class="hidden text-red-600 mt-4 font-semibold">
          ❌ Weather Data Not Found
        </p>
      </div>
    </div>

    <script src="./JS/weather.js"></script>
  </body>
</html>
