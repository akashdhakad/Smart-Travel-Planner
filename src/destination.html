<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Destination-Smart Travel Planner</title>

    <link
      rel="icon"
      href="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS0ku_JAxG2yYPtQ1m3e0XNY3vaw5bL8IhHBg&s"
    />
    <link rel="stylesheet" href="output.css" />
  </head>
  <body class="bg-gray-200 min-h-screen">
    <nav class="bg-white shadow-md">
      <div class="max-w-6xl mx-auto px-4">
        <div class="flex justify-between items-center h-16">
          <div class="text-xl font-bold text-blue-600">Smart Travel</div>
          <div class="hidden md:flex space-x-6">
            <a href="home.html" class="text-gray-700 hover:text-blue-600"
              >Home</a
            >
            <a href="destination.html" class="text-gray-700 hover:text-blue-600"
              >Destination</a
            >
            <a href="weather.html" class="text-gray-700 hover:text-blue-600"
              >Weather</a
            >
            <a href="places.html" class="text-gray-700 hover:text-blue-600"
              >Places</a
            >
            <a href="budget.html" class="text-gray-700 hover:text-blue-600"
              >Budget</a
            >
          </div>
        </div>
      </div>
    </nav>
    <!-- main content -->
    <div class="flex flex-col items-center justify-center mt-20">
      <div
        class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md text-center"
      >
        <h1 class="text-2xl font-bold text-center mb-6 text-sky-600">
          City OverView
        </h1>
        <p class="text-gray-700 mb-2">You Searched For :</p>
        <h2 id="cityName" class="text-xl font-semibold text-sky-600 mb-4"></h2>

        <div id="loading" class="mt-4 text-green-400">Loading City Info...</div>
        <div
          id="cityInfoBox"
          class="hidden mt-4 bg-gray-50 p-4 rounded-lg shadow-inner space-y-3 text-gray-700"
        >
          <div class="flex justify-between">
            <span class="font-semibold">Latitude:</span>
            <span id="lat"></span>

            <span class="font-semibold">Longitude:</span>
            <span id="lon"></span>
          </div>
          <div class="flex justify-between">
            <span class="font-semibold">Country:</span>
            <span id="country"></span>

            <span class="font-semibold">State:</span>
            <span id="state"></span>
          </div>
          <div class="flex justify-between">
            <span class="font-semibold">Population:</span>
            <span id="population"></span>
          </div>
        </div>
        <p id="error" class="hidden text-red-500 font-semibold mt-2">City Not Found...</p>
      </div>
    </div>
    <script src="./js/destination.js"></script>
  </body>
</html>
